<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 × 50 na chatě</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--pine:#16302a;--moss:#8fae7d;--birch:#eef1ec;--dusk:#c9d6e3}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--pine);color:var(--birch);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:grid;place-items:center;padding:2rem;text-align:center}
.big{font-size:clamp(5rem,26vw,14rem);font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--moss)}
.big span{color:var(--birch);font-weight:400}
h1{font-size:clamp(1.4rem,5vw,2.2rem);font-weight:400;margin-top:1.2rem}
p{margin-top:1rem;color:var(--dusk);max-width:32ch;margin-inline:auto;line-height:1.5}
</style>
</head>
<body>
<main>
  <div class="big">4<span>×</span>50</div>
  <h1>Oslava na chatě</h1>
  <p>Stránka se připravuje. Brzy tu najdete termín, místo a vše, co s sebou.</p>
</main>
</body>
</html>
